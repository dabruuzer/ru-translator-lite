<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Translator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 600px;
            margin: 50px auto;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        h2 { margin-top: 0; color: #ffffff; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #444;
            border-radius: 5px;
            background-color: #2c2c2c;
            color: #e0e0e0;
            font-family: inherit;
            box-sizing: border-box;
            font-size: 16px;
        }
        textarea::placeholder {
            color: #888;
        }
        select, button {
            padding: 12px;
            border-radius: 5px;
            border: 1px solid #444;
            font-size: 16px;
            background-color: #2c2c2c;
            color: #e0e0e0;
            box-sizing: border-box;
        }
        select { width: 100%; margin-bottom: 15px; }
        #directionSelect { font-weight: bold; font-size: 18px; background-color: #333; }
        .checkbox-container { margin-bottom: 20px; font-weight: bold; color: #ffb74d; display: flex; align-items: center; }
        .checkbox-container input { width: 20px; height: 20px; margin-right: 10px; }
        button {
            background-color: #0288d1;
            color: white;
            border: none;
            width: 100%;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
            padding: 15px; 
        }
        button:hover { background-color: #0277bd; }
        #copyBtn {
            background-color: #424242;
            margin-top: 10px;
            display: none; 
        }
        #copyBtn:hover { background-color: #555555; }
        #settingsBtn {
            background-color: transparent;
            color: #888;
            border: 1px solid #444;
            margin-top: 20px;
            font-size: 12px;
            padding: 8px;
        }
        #output {
            margin-top: 20px;
            padding: 15px;
            background: #2c2c2c;
            border-radius: 5px;
            min-height: 80px;
            white-space: pre-wrap;
            color: #e0e0e0;
            border: 1px solid #444;
            font-size: 16px;
        }
        
        @media (max-width: 600px) {
            body { margin: 10px; padding: 20px; }
        }
    </style>
</head>
<body>

    <h2>Translator (Lite)</h2>

    <select id="directionSelect">
        <option value="en-ru">🇺🇸 English ➔ 🇷🇺 Russian</option>
        <option value="ru-en">🇷🇺 Russian ➔ 🇺🇸 English</option>
    </select>

    <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>

    <select id="styleSelect">
        <option value="Casual / Modern Slang">Casual / Modern Slang</option>
        <option value="Standard Everyday">Standard Everyday</option>
        <option value="Business Formal">Business Formal</option>
        <option value="Literary / Poetic">Literary / Poetic</option>
        <option value="Strictly Literal">Strictly Literal</option>
    </select>

    <div class="checkbox-container">
        <label style="display: flex; align-items: center; cursor: pointer;">
            <input type="checkbox" id="profanityCheck"> Preserve Profanity & Harsh Tone (Unfiltered)
        </label>
    </div>

    <button onclick="translateText()">Translate</button>

    <div id="output">Your translation will appear here...</div>
    <button id="copyBtn" onclick="copyTranslation()">📋 Copy Translation</button>
    <button id="settingsBtn" onclick="resetKey()">Reset API Key</button>

    <script>
        // Key management functions
        function getApiKey() {
            let key = localStorage.getItem('gemini_api_key');
            if (!key) {
                key = prompt("First-time setup: Please paste your Google Gemini API Key here.\n\nIt will be saved securely inside this browser and will NOT be uploaded to the internet.");
                if (key && key.trim() !== "") {
                    localStorage.setItem('gemini_api_key', key.trim());
                } else {
                    alert("An API key is required to use the translator.");
                    return null;
                }
            }
            return key;
        }

        function resetKey() {
            localStorage.removeItem('gemini_api_key');
            alert("API Key cleared. You will be prompted to enter a new one next time you translate.");
        }

        async function translateText() {
            const text = document.getElementById('inputText').value;
            const style = document.getElementById('styleSelect').value;
            const direction = document.getElementById('directionSelect').value;
            const keepProfanity = document.getElementById('profanityCheck').checked;
            const outputDiv = document.getElementById('output');
            const copyBtn = document.getElementById('copyBtn');

            if (!text.trim()) {
                outputDiv.innerText = "Please enter some text first.";
                copyBtn.style.display = 'none';
                return;
            }

            const API_KEY = getApiKey();
            if (!API_KEY) return; // Stop if they cancelled the prompt

            outputDiv.innerText = "Translating...";
            copyBtn.style.display = 'none';

            const sourceLang = direction === 'en-ru' ? 'English' : 'Russian';
            const targetLang = direction === 'en-ru' ? 'Russian' : 'English';

            let promptText = `Act as a strict, direct bilingual translator. Translate the following ${sourceLang} text into ${targetLang}. Ensure the translation precisely matches this requested style: [${style}].\n\nCRITICAL INSTRUCTION: You must output ONLY the final translated text. Do NOT include any introductory phrases, explanations, bullet points, or multiple options. Return the translated text and absolutely nothing else.`;
            
            if (keepProfanity) {
                promptText += " WARNING: The user requires an unfiltered translation. Preserve profanity and harsh tone, BUT do not artificially escalate the severity. Translate words to their exact severity equivalent (e.g. translate 'pussy' to 'киска' or an equivalent insult for a coward, but reserve extreme Russian 'mat' roots like 'пизда' strictly for words of equivalent extreme severity like 'cunt').";
            }
            
            promptText += `\n\nText to translate:\n"${text}"`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': API_KEY 
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptText }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    outputDiv.innerText = "API Error: " + data.error.message;
                    // If the key is invalid or revoked, clear it automatically
                    if (data.error.code === 400 || data.error.code === 403) {
                        localStorage.removeItem('gemini_api_key');
                        outputDiv.innerText += "\n\nYour API key was invalid. It has been cleared from memory. Click Translate to enter it again.";
                    }
                } else if (data.candidates && data.candidates.length > 0) {
                    outputDiv.innerText = data.candidates[0].content.parts[0].text;
                    copyBtn.style.display = 'block'; 
                } else {
                    outputDiv.innerText = "An unknown error occurred. Please try again.";
                }
            } catch (error) {
                outputDiv.innerText = "Network error. Check your internet connection.";
            }
        }

        async function copyTranslation() {
            const textToCopy = document.getElementById('output').innerText;
            const copyBtn = document.getElementById('copyBtn');
            
            try {
                await navigator.clipboard.writeText(textToCopy);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = "✓ Copied!";
                copyBtn.style.backgroundColor = "#2e7d32"; 
                
                setTimeout(() => {
                    copyBtn.innerText = originalText;
                    copyBtn.style.backgroundColor = "#424242"; 
                }, 2000);
            } catch (err) {
                alert("Failed to copy text automatically. Please select and copy manually.");
            }
        }
    </script>
</body>
</html>
