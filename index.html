<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dab's Nuance Translator 2.0</title>
    
    <!-- Tailwind CSS for styling and automatic dark mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for clean, scalable icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar { width: 8px; }
        textarea::-webkit-scrollbar-track { background: transparent; }
        textarea::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 20px; }
        @media (prefers-color-scheme: dark) {
            textarea::-webkit-scrollbar-thumb { background-color: #475569; }
        }

        /* Mic pulse animation when listening */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        .mic-listening { animation: pulse-ring 2s infinite; color: #ef4444 !important; }
    </style>
</head>

<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen flex items-center justify-center p-4 transition-colors duration-300">

    <div class="w-full max-w-lg bg-white dark:bg-gray-800 rounded-2xl shadow-xl overflow-hidden transition-colors duration-300">
        
        <!-- Header -->
        <div class="bg-blue-600 dark:bg-blue-800 text-white p-5 text-center">
            <h1 class="text-2xl font-bold tracking-tight">Dab's Nuance Translator 2.0</h1>
            <p class="text-blue-200 text-sm mt-1">Context-aware, AI-powered language engine</p>
        </div>

        <!-- App Content -->
        <div class="p-6 space-y-5">
            
            <!-- Language Selection -->
            <div class="flex items-center justify-between gap-2">
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">From</label>
                    <select id="sourceLang" onchange="savePreferences()" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-colors">
                        <!-- Populated via JS -->
                    </select>
                </div>
                
                <button onclick="swapLanguages()" class="mt-5 p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 transition-colors text-blue-600 dark:text-blue-400" title="Swap Languages">
                    <i class="fas fa-exchange-alt"></i>
                </button>
                
                <div class="flex-1">
                    <label class="block text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-1">To</label>
                    <select id="targetLang" onchange="savePreferences()" class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white transition-colors">
                        <!-- Populated via JS -->
                    </select>
                </div>
            </div>

            <!-- Controls Grid: Gender, Tone, Profanity -->
            <div class="bg-gray-50 dark:bg-gray-700/50 p-4 rounded-xl border border-gray-200 dark:border-gray-700 space-y-4">
                
                <!-- Gender Toggle -->
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 text-sm font-medium">
                        <span>I am:</span>
                        <button onclick="openInfoModal('gender')" class="text-gray-400 hover:text-blue-500 transition-colors" title="Why do we need this?"><i class="fas fa-info-circle"></i></button>
                    </div>
                    <div class="flex bg-gray-200 dark:bg-gray-600 rounded-lg p-1 w-48 relative">
                        <!-- Moving background pill -->
                        <div id="genderPill" class="absolute top-1 bottom-1 w-[calc(50%-4px)] bg-white dark:bg-gray-800 rounded-md shadow transition-transform duration-200 ease-in-out left-1"></div>
                        <button id="btnMale" onclick="setGender('male')" class="flex-1 relative z-10 py-1 text-sm font-medium text-gray-800 dark:text-gray-200 transition-colors">Male</button>
                        <button id="btnFemale" onclick="setGender('female')" class="flex-1 relative z-10 py-1 text-sm font-medium text-gray-500 dark:text-gray-400 transition-colors">Female</button>
                    </div>
                </div>

                <!-- Tone Selection -->
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium">Tone / Style:</span>
                    <select id="toneSelect" onchange="savePreferences()" class="bg-white dark:bg-gray-600 border border-gray-300 dark:border-gray-500 rounded-md px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 w-48 dark:text-white transition-colors">
                        <option value="Casual & Modern (Use natural slang)">Casual & Modern</option>
                        <option value="Standard / Neutral">Standard</option>
                        <option value="Professional & Formal">Professional</option>
                        <option value="Strictly Literal">Literal</option>
                    </select>
                </div>

                <!-- Profanity Checkbox -->
                <div class="flex items-center justify-between pt-1">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="checkbox" id="profanityCheck" onchange="savePreferences()" class="w-4 h-4 text-blue-600 rounded border-gray-300 focus:ring-blue-500">
                        <span class="text-sm font-medium">Preserve Profanity</span>
                    </label>
                    <button onclick="openInfoModal('profanity')" class="text-gray-400 hover:text-blue-500 transition-colors" title="Profanity constraints"><i class="fas fa-info-circle"></i></button>
                </div>
            </div>

            <!-- Input Area with Clear & Mic -->
            <div class="relative">
                <textarea id="inputText" rows="4" placeholder="Type or speak what you want to translate..." class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-xl p-3 pr-10 text-base focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none dark:text-white transition-colors"></textarea>
                
                <!-- Clear 'X' Button -->
                <button onclick="clearInput()" class="absolute top-3 right-3 text-gray-400 hover:text-red-500 transition-colors" title="Clear Text">
                    <i class="fas fa-times"></i>
                </button>

                <!-- Mic Button -->
                <button id="micBtn" onclick="toggleMic()" class="absolute bottom-3 right-3 text-gray-400 hover:text-blue-600 transition-colors" title="Use Microphone">
                    <i class="fas fa-microphone text-xl"></i>
                </button>
            </div>

            <!-- Translate Button -->
            <button onclick="translateText()" id="translateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg transition-all transform hover:-translate-y-0.5 flex justify-center items-center gap-2">
                <i class="fas fa-language"></i>
                <span>Translate With Nuance</span>
            </button>

            <!-- Output Area -->
            <textarea id="outputText" rows="4" readonly placeholder="Translation will appear here..." class="w-full bg-blue-50 dark:bg-gray-700/80 border border-blue-200 dark:border-gray-600 rounded-xl p-3 text-base text-gray-900 dark:text-blue-100 resize-none focus:outline-none transition-colors"></textarea>
            
            <!-- Footer: API Key Reset -->
            <div class="pt-2 flex justify-center items-center gap-3 border-t border-gray-200 dark:border-gray-700">
                <button onclick="openApiKeyModal()" class="text-sm text-gray-500 hover:text-gray-800 dark:text-gray-400 dark:hover:text-gray-200 transition-colors flex items-center gap-2">
                    <i class="fas fa-key"></i> Settings / API Key
                </button>
                <button onclick="openInfoModal('apikey')" class="text-gray-400 hover:text-blue-500 transition-colors" title="What is an API Key?"><i class="fas fa-info-circle"></i></button>
            </div>

        </div>
    </div>

    <!-- Reusable Info Modal Overlay -->
    <div id="infoModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="infoModalContent">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modalTitle" class="text-lg font-bold text-gray-900 dark:text-white">Title</h3>
                <button onclick="closeModal('infoModal')" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <p id="modalText" class="text-sm text-gray-600 dark:text-gray-300 leading-relaxed">Text goes here...</p>
            <button onclick="closeModal('infoModal')" class="mt-6 w-full bg-gray-100 hover:bg-gray-200 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-medium py-2 rounded-lg transition-colors">
                Got it
            </button>
        </div>
    </div>

    <!-- Custom API Key Input Modal -->
    <div id="apiKeyModal" class="fixed inset-0 bg-black/70 backdrop-blur-md flex items-center justify-center p-4 hidden z-50 opacity-0 transition-opacity duration-300">
        <div class="bg-white dark:bg-gray-800 rounded-2xl max-w-md w-full p-6 shadow-2xl transform scale-95 transition-transform duration-300" id="apiKeyModalContent">
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-2"><i class="fas fa-lock text-blue-500 mr-2"></i>API Key Setup</h3>
            <p class="text-sm text-gray-600 dark:text-gray-300 mb-4">
                Enter your free Google Gemini API key to power the translations. Your key is saved locally and never shared.
            </p>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy..." class="w-full bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 dark:text-white mb-4">
            
            <div class="flex gap-3">
                <button onclick="closeModal('apiKeyModal')" class="flex-1 bg-gray-200 hover:bg-gray-300 dark:bg-gray-700 dark:hover:bg-gray-600 text-gray-800 dark:text-white font-medium py-2 rounded-lg transition-colors">
                    Cancel
                </button>
                <button onclick="saveApiKey()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors">
                    Save Key
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Configuration & High Resource Languages ---
        // These are the languages the LLM is most fluent and reliable with.
        const LANGUAGES = {
            "en": "English",
            "es": "Spanish",
            "fr": "French",
            "de": "German",
            "it": "Italian",
            "pt": "Portuguese",
            "ru": "Russian",
            "ar": "Arabic",
            "zh": "Chinese (Mandarin)",
            "ja": "Japanese",
            "ko": "Korean",
            "hi": "Hindi",
            "nl": "Dutch",
            "tr": "Turkish",
            "pl": "Polish",
            "vi": "Vietnamese"
        };

        // --- Info Modal Content Dictionary ---
        const MODAL_CONTENT = {
            'gender': {
                title: "Why ask for 'I am'?",
                text: "Many languages (like Russian, Spanish, and Arabic) change the spelling of verbs and adjectives based on the gender of the person speaking. Setting this ensures your translated sentences are grammatically perfect when you talk about yourself."
            },
            'profanity': {
                title: "Profanity Filter Limitations",
                text: "The AI is highly advanced, but it may occasionally struggle with obscure, regional slang or highly transliterated words. Checking this box tells the AI to preserve the raw, original emotion and explicit words rather than politely censoring them."
            },
            'apikey': {
                title: "What is an API Key?",
                text: `To power these advanced translations, the app connects directly to Google's Gemini AI. You need a free personal access code (API Key) from <a href="https://aistudio.google.com" target="_blank" rel="noopener noreferrer" class="text-blue-600 dark:text-blue-400 hover:underline font-medium">aistudio.google.com</a>.<br><br>Your key is stored safely on your device's local memory and is never shared with anyone.`
            }
        };

        // --- State Variables ---
        let currentGender = 'male'; // Default
        let isRecording = false;
        let recognition = null;

        // --- STREAMING_CHUNK:Setting up initialization and UI manipulation functions... ---
        document.addEventListener('DOMContentLoaded', () => {
            populateLanguageSelects();
            initSpeechRecognition();
            loadPreferences();
        });

        function populateLanguageSelects() {
            const sourceSelect = document.getElementById('sourceLang');
            const targetSelect = document.getElementById('targetLang');
            
            sourceSelect.innerHTML = '<option value="auto">Detect Language</option>';
            targetSelect.innerHTML = ''; 

            for (const [code, name] of Object.entries(LANGUAGES)) {
                sourceSelect.innerHTML += `<option value="${code}">${name}</option>`;
                targetSelect.innerHTML += `<option value="${code}">${name}</option>`;
            }
        }

        // New function to clear the input text
        function clearInput() {
            document.getElementById('inputText').value = '';
            document.getElementById('outputText').value = '';
            
            if (isRecording && recognition) {
                recognition.stop();
                stopMicUI();
            }
        }

        function setGender(gender) {
            currentGender = gender;
            const btnMale = document.getElementById('btnMale');
            const btnFemale = document.getElementById('btnFemale');
            const pill = document.getElementById('genderPill');

            if (gender === 'male') {
                pill.style.transform = 'translateX(0)';
                btnMale.classList.replace('text-gray-500', 'text-gray-800');
                btnMale.classList.replace('dark:text-gray-400', 'dark:text-gray-200');
                btnFemale.classList.replace('text-gray-800', 'text-gray-500');
                btnFemale.classList.replace('dark:text-gray-200', 'dark:text-gray-400');
            } else {
                pill.style.transform = 'translateX(100%)';
                btnFemale.classList.replace('text-gray-500', 'text-gray-800');
                btnFemale.classList.replace('dark:text-gray-400', 'dark:text-gray-200');
                btnMale.classList.replace('text-gray-800', 'text-gray-500');
                btnMale.classList.replace('dark:text-gray-200', 'dark:text-gray-400');
            }
            savePreferences();
        }

        function swapLanguages() {
            const sourceSelect = document.getElementById('sourceLang');
            const targetSelect = document.getElementById('targetLang');
            
            if (sourceSelect.value === "auto") {
                sourceSelect.value = targetSelect.value;
                targetSelect.value = "en"; 
            } else {
                const temp = sourceSelect.value;
                sourceSelect.value = targetSelect.value;
                targetSelect.value = temp;
            }
            savePreferences();
        }

        // --- STREAMING_CHUNK:Implementing local storage state preservation... ---
        // --- LocalStorage Memory ---
        function savePreferences() {
            const prefs = {
                source: document.getElementById('sourceLang').value,
                target: document.getElementById('targetLang').value,
                gender: currentGender,
                tone: document.getElementById('toneSelect').value,
                profanity: document.getElementById('profanityCheck').checked
            };
            localStorage.setItem('dabs_translator_prefs', JSON.stringify(prefs));
        }

        function loadPreferences() {
            const saved = localStorage.getItem('dabs_translator_prefs');
            if (saved) {
                try {
                    const prefs = JSON.parse(saved);
                    document.getElementById('sourceLang').value = prefs.source || 'en';
                    document.getElementById('targetLang').value = prefs.target || 'ru';
                    document.getElementById('toneSelect').value = prefs.tone || 'Casual & Modern (Use natural slang)';
                    document.getElementById('profanityCheck').checked = !!prefs.profanity;
                    setGender(prefs.gender || 'male');
                } catch (e) {
                    document.getElementById('sourceLang').value = 'en';
                    document.getElementById('targetLang').value = 'ru';
                }
            } else {
                document.getElementById('sourceLang').value = 'en';
                document.getElementById('targetLang').value = 'ru';
            }
        }

        // --- STREAMING_CHUNK:Adding Web Speech API logic... ---
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onstart = function() {
                    isRecording = true;
                    document.getElementById('micBtn').classList.add('mic-listening');
                };

                recognition.onresult = function(event) {
                    const transcript = event.results[0][0].transcript;
                    const inputArea = document.getElementById('inputText');
                    inputArea.value = inputArea.value ? inputArea.value + ' ' + transcript : transcript;
                };

                recognition.onerror = function(event) {
                    console.error("Speech recognition error", event.error);
                    stopMicUI();
                };

                recognition.onend = function() {
                    stopMicUI();
                };
            } else {
                document.getElementById('micBtn').style.display = 'none';
            }
        }

        function toggleMic() {
            if (!recognition) return;

            if (isRecording) {
                recognition.stop();
                stopMicUI();
            } else {
                const sourceLang = document.getElementById('sourceLang').value;
                recognition.lang = sourceLang === 'auto' ? navigator.language : sourceLang;
                recognition.start();
            }
        }

        function stopMicUI() {
            isRecording = false;
            document.getElementById('micBtn').classList.remove('mic-listening');
        }

        // --- STREAMING_CHUNK:Handling Modals and API logic... ---
        function openInfoModal(type) {
            const content = MODAL_CONTENT[type];
            if (content) {
                document.getElementById('modalTitle').innerText = content.title;
                document.getElementById('modalText').innerHTML = content.text;
                
                const modal = document.getElementById('infoModal');
                const modalContent = document.getElementById('infoModalContent');
                
                modal.classList.remove('hidden');
                setTimeout(() => {
                    modal.classList.remove('opacity-0');
                    modalContent.classList.remove('scale-95');
                }, 10);
            }
        }

        function openApiKeyModal() {
            const currentKey = localStorage.getItem('gemini_api_key') || '';
            document.getElementById('apiKeyInput').value = currentKey;
            
            const modal = document.getElementById('apiKeyModal');
            const modalContent = document.getElementById('apiKeyModalContent');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                modalContent.classList.remove('scale-95');
            }, 10);
            
            document.getElementById('apiKeyInput').focus();
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            const modalContent = document.getElementById(modalId + 'Content');
            
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300); 
        }

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
            } else {
                localStorage.removeItem('gemini_api_key'); 
            }
            closeModal('apiKeyModal');
        }

        // --- STREAMING_CHUNK:Executing the AI translation fetch... ---
        async function translateText() {
            const textToTranslate = document.getElementById('inputText').value.trim();
            if (!textToTranslate) return;

            const apiKey = localStorage.getItem('gemini_api_key');
            if (!apiKey) {
                openApiKeyModal();
                return;
            }

            const btn = document.getElementById('translateBtn');
            const outBox = document.getElementById('outputText');
            
            // UI Loading state
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Translating...';
            btn.disabled = true;
            btn.classList.add('opacity-75');
            outBox.value = "";

            // Gather Context settings
            const sourceCode = document.getElementById('sourceLang').value;
            const targetCode = document.getElementById('targetLang').value;
            
            const sourceName = sourceCode === 'auto' ? 'the detected language' : LANGUAGES[sourceCode];
            const targetName = LANGUAGES[targetCode];
            
            const tone = document.getElementById('toneSelect').value;
            const keepProfanity = document.getElementById('profanityCheck').checked;
            const profanityInstruction = keepProfanity 
                ? "PRESERVE all profanity, swear words, and slang exactly as intended in the target language. Do not censor." 
                : "FILTER out profanity and highly offensive language appropriately.";

            // Constructing the Prompt
            const prompt = `You are a professional, context-aware translator.
Task: Translate the following text from ${sourceName} to ${targetName}.
Context & Rules:
1. The speaker is ${currentGender}. Ensure perfect grammatical gender agreement for verbs and adjectives referring to the speaker.
2. Tone & Style: ${tone}. Adapt idioms and phrasing to match this style perfectly.
3. ${profanityInstruction}
4. ONLY return the translated text. Do not provide any conversational filler, explanations, or quotes around the output.

Text to translate:
${textToTranslate}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content && data.candidates[0].content.parts[0].text) {
                    outBox.value = data.candidates[0].content.parts[0].text.trim();
                } else {
                    outBox.value = "Translation failed. The model returned an empty response. (It may have triggered a safety filter).";
                }

            } catch (error) {
                console.error("Translation error:", error);
                if (error.message.includes('400')) {
                    outBox.value = "Error: Invalid API Key. Please click Settings below and check your key.";
                    localStorage.removeItem('gemini_api_key');
                } else {
                    outBox.value = "Network or API Error. Please check your connection and try again.";
                }
            } finally {
                // Restore UI
                btn.innerHTML = '<i class="fas fa-language"></i><span>Translate With Nuance</span>';
                btn.disabled = false;
                btn.classList.remove('opacity-75');
            }
        }
    </script>
</body>
</html>
